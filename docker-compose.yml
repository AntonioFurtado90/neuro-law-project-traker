services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurolaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurolaw}
      POSTGRES_DB: ${POSTGRES_DB:-neurolaw}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  scripts:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      target: runtime
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CAMARA_API_BASE_URL: ${CAMARA_API_BASE_URL:-https://dadosabertos.camara.leg.br/api/v2}
      SENADO_API_BASE_URL: ${SENADO_API_BASE_URL:-https://legis.senado.leg.br/dadosabertos}
      CAMARA_BILL_TYPE: ${CAMARA_BILL_TYPE:-PL}
      SENADO_BILL_TYPE: ${SENADO_BILL_TYPE:-PL}
      RUN_WINDOW_START: ${RUN_WINDOW_START:-}
      RUN_WINDOW_END: ${RUN_WINDOW_END:-}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-3}
      HTTP_BACKOFF_SECONDS: ${HTTP_BACKOFF_SECONDS:-2}
    volumes:
      - ./workdir:/workdir
    command: ["version"]

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://neurolaw:neurolaw@db:5432/neurolaw?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - db
    volumes:
      - ./workdir:/workdir
    command: ["version"]

  orchestrator-integration-tests:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: test-integration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://neurolaw:neurolaw@db:5432/neurolaw?sslmode=disable}
    depends_on:
      - db
    profiles: ["test"]

volumes:
  db_data:
